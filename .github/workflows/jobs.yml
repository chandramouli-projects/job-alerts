name: Find my jobs

on:
  schedule:
    - cron: "30 1,4,7,10,13,16 * * *" # 7 AM, 10 AM, 1 PM, 4 PM, 7 PM, 10 PM IST
  workflow_dispatch: # "Run workflow" button; optional search text
    inputs:
      query:
        description: "Search for (e.g. QA Testing jobs in Hyderabad). Leave empty for the normal search."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: find-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Fetch, filter and notify
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          NOTIFY_URL: https://udyogam-vetuku.pages.dev/api/push/run # alerts with the app closed
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_QUERY: ${{ github.event.inputs.query }}
        run: python backend/collector/fetch_jobs.py
      - name: Save results
        if: always()
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add frontend/public/data/jobs.json database/state.json
          git diff --cached --quiet || git commit -m "New jobs $(date -u +'%Y-%m-%d %H:%M')"
          git push
