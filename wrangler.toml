# Cloudflare Pages settings for the website (https://udyogam-vetuku.pages.dev).
# Cloudflare reads this on every deploy: the site is the frontend/ folder, with no build step.
name = "udyogam-vetuku"
pages_build_output_dir = "./frontend"
compatibility_date = "2025-01-01"

# Accounts database for functions/api (D1, Cloudflare's free SQLite). Tables: database/cloudflare.sql
[[d1_databases]]
binding = "DB"
database_name = "udyogam-db"
database_id = "602d1b40-270e-4e16-a7d5-e8d7b4f756c5"

# Public key for alerts with the app closed (Web Push); the private key is a Cloudflare secret
[vars]
VAPID_PUBLIC_KEY = "BF_GvrEMzhSKD036uYLR29OnrYXr19txEMUYjARC9FibbK_9m3B6dym1LrbYCvo7lstsgIwjz7dWlnJd57yhn0o"
# Google sign-in for "Connect Gmail" (not secret); GOOGLE_CLIENT_SECRET and TOKEN_KEY are Cloudflare secrets
# GOOGLE_CLIENT_ID = "<from Google Cloud>"
